name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Markdown 文件格式
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
